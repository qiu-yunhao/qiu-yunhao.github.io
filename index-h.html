<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starry Night | Welcome</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="starry-page">
    <div class="stars"></div>
    <div class="twinkling"></div>
    <div class="clouds"></div>
    
    <main class="starry-container">
        <div class="starry-content">
            <h1 class="starry-title">Welcome to My Cosmos</h1>
            <p class="starry-subtitle">Where dreams sparkle like stars and ideas flow like galaxies</p>
            
            <div class="constellation">
                <div class="star-point" style="top: 20%; left: 15%;"></div>
                <div class="star-point" style="top: 40%; left: 30%;"></div>
                <div class="star-point" style="top: 60%; left: 45%;"></div>
                <div class="star-point" style="top: 80%; left: 60%;"></div>
                <div class="star-point" style="top: 30%; left: 75%;"></div>
                <div class="star-point" style="top: 50%; left: 90%;"></div>
                <div class="star-point" style="top: 70%; left: 10%;"></div>
                <div class="star-point" style="top: 10%; left: 50%;"></div>
            </div>
            
            <div class="quote">
                <i class="fas fa-quote-left"></i>
                <p>Look at the stars. See their beauty. In their light, see yourself.</p>
                <i class="fas fa-quote-right"></i>
            </div>
            
            <div class="enter-button-container">
                <button class="enter-button" id="enterBlog">
                    <span class="button-text">Enter My Blog</span>
                    <span class="button-icon">
                        <i class="fas fa-arrow-right"></i>
                    </span>
                    <div class="button-glow"></div>
                </button>
                <p class="hint">Click to explore my universe of thoughts</p>
            </div>
            
            <div class="social-links">
                <a href="#" class="social-link" title="QQ"><i class="fab fa-qq"></i></a>
                <a href="#" class="social-link" title="WeChat"><i class="fab fa-weixin"></i></a>
                <a href="#" class="social-link" title="Phone"><i class="fas fa-phone-alt"></i></a>
                <a href="#" class="social-link" title="Email"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
        
        <footer class="starry-footer">
            <p>Made with <i class="fas fa-heart"></i> under the starry night</p>
        </footer>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
